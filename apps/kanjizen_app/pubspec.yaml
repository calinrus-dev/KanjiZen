name: kanjizen_app
description: Capa de presentación de KanjiZen. Widgets, Screens, GoRouter. Orquesta todos los paquetes del workspace.

publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.32.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.3
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  kz_core:
    path: ../../packages/kz_core
  kz_data:
    path: ../../packages/kz_data
  kz_domain:
    path: ../../packages/kz_domain
  kz_ui_components:
    path: ../../packages/kz_ui_components
  lottie: ^3.3.1
  path_drawing: ^1.0.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/lotties/
    - assets/data/
