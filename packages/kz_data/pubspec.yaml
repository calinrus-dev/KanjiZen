name: kz_data
description: Implementación Isar, entidades de BD, servicios TTS y DTOs. Gestiona todo el pipeline de datos y persistencia.

publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.32.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  # Paquetes internos del workspace
  kz_core:
    path: ../kz_core
  path_provider: ^2.1.5

dev_dependencies:
  archive: ^3.6.1
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  isar_generator: ^3.1.0+1
  xml: ^6.3.0
