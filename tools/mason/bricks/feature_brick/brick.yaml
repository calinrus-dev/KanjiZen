name: feature_brick
description: Generates the standard structure of a feature in kanjizen_app (presentation, providers, domain).
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.52 <0.1.0"

vars:
  name:
    type: string
    description: The name of the feature in snake_case (e.g. home, inventory, profile)
    prompt: "What is the feature name?"
