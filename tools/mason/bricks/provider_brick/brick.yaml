name: provider_brick
description: Generates a Riverpod @riverpod notifier with reset/dispose boilerplate.
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.52 <0.2.0"

vars:
  name:
    type: string
    description: The name of the provider in snake_case (e.g. session, campaign)
    prompt: "What is the provider name?"
